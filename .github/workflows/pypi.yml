name: PyPI

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Building is not running, but keeping the builder inside the supported
        # range avoids surprises from a toolchain older than the requires-python
        # floor declared in pyproject.toml.
        python-version: '3.12'
    - name: Install pypa/build
      run: python -m pip install --upgrade pip build
    - name: Build a binary wheel and a source tarball
      run: python -m build --sdist --wheel --outdir dist/ .

    # Test PyPI first, as a dry run of the real upload. skip-existing keeps a
    # re-run of an already-uploaded version from failing here and blocking the
    # PyPI step behind it.
    - name: Publish distribution to Test PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

    - name: Publish distribution to PyPI
      if: startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
