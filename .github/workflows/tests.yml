name: CI

on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  skip_duplicate:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@master
        with:
          github_token: ${{ github.token }}
  test-pip:
      needs: skip_duplicate
      if: ${{ needs.skip_duplicate.outputs.should_skip == 'false' }}
      strategy:
        matrix:
          # Must stay within the requires-python floor declared in pyproject.toml.
          python-version: [ "3.11", "3.12", "3.13" ]
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        # The action is pinned; the uv release it installs deliberately is not.
        # uv.lock is written in a revision that older uv cannot parse, and a
        # "version:" pin here would silently outlive the format it was chosen for.
        # Note that setup-uv publishes no moving major tag beyond v7, so this has
        # to name a full release.
        - name: Install uv
          uses: astral-sh/setup-uv@v9.0.0
          with:
            enable-cache: true
        - name: Set up Python ${{ matrix.python-version }}
          run: uv python install ${{ matrix.python-version }}
        - name: Install dependencies
          run: uv sync --dev --extra optional
        - name: Run flake8
          run: uv run make flake8
        - name: Run mypy
          run: uv run make mypy
        - name: Check license
          run: |
            git clean -fd
            uv run make check-license
        - name: Check format
          run: |
            git clean -d -f -f
            uv run make check-format
        - name: Check notebook outputs carry no local paths
          run: uv run make check-notebooks
        - name: Test with pytest
          run: uv run make coverage
        - name: Run notebooks
          run: uv run make run-notebooks
        - name: Upload coverage
          uses: codecov/codecov-action@v1
          with:
            token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token