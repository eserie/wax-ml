# Install the pre-commit hooks below with
# 'pre-commit install'

# Auto-update the version of the hooks with
# 'pre-commit autoupdate'

# Run the hooks on all files with
# 'pre-commit run --all'

repos:
- repo: https://gitlab.com/pycqa/flake8
  rev: '3.8.4'
  hooks:
  - id: flake8

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 'v0.800'
  hooks:
  - id: mypy
    files: wax/

- repo: https://github.com/mwouts/jupytext
  rev: v1.10.0
  hooks:
  - id: jupytext
    args: [--sync]

# Notebook outputs are build artifacts, not sources: the documentation regenerates
# them (see nb_execution_mode in docs/conf.py). Stripping them keeps diffs readable
# and, above all, keeps machine-local paths out of the repository -- warning
# tracebacks embed the absolute path of whoever ran the notebook.
- repo: https://github.com/kynan/nbstripout
  rev: 0.8.1
  hooks:
  - id: nbstripout
