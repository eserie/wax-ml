[project]
name = "wax-ml"
dynamic = ["version"]
description = "A Python library for machine-learning and feedback loops on streaming data"
license = "Apache-2.0"
readme = "README.md"
authors = [
    {name = "WAX-ML Authors", email = "eserie@gmail.com"}
]
keywords = [
    "time series",
    "machine learning", 
    "optimization",
    "optimal control",
    "online learning",
    "reinforcement learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "dm-haiku>=0.0.16",
    "flax>=0.12.4",
    "jax>=0.9.0",
    "jaxlib>=0.9.0",
    "numpy>=2.2.6",
    "optax>=0.2.5",
    "pandas>=2.3.0",
    "pooch>=1.8.2",
    "scikit-learn>=1.7.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "xarray>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/eserie/wax-ml"
Repository = "https://github.com/eserie/wax-ml"

[project.optional-dependencies]
optional = [
    "graphviz>=0.21",
    "numba>=0.61.2",
    "optax>=0.2.5",
    "plotnine>=0.14.6",
    "pooch>=1.8.2",
    "pyarrow>=20.0.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561 marker. Without it the annotations are invisible to type checkers running
# against an installed wax-ml -- including mypy in this project's own CI, which
# resolves the package rather than the source tree.
[tool.setuptools.package-data]
wax = ["py.typed", "VERSION"]

[tool.setuptools.dynamic]
version = {file = "src/wax/VERSION"}

[dependency-groups]
dev = [
    "autoflake>=2.3.1",
    "autopep8>=2.3.2",
    "black>=25.1.0",
    "coverage>=7.9.1",
    "flake8>=7.3.0",
    "flaky>=3.8.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "isort>=5.3.0",
    "jupyter-cache>=1.0.0",
    "jupytext>=1.17.2",
    "line-profiler>=4.2.0",
    "matplotlib>=3.10.3",
    "mypy>=1.16.1",
    "myst-nb>=1.2.0",
    "nbconvert>=7.16.6",
    "nbstripout>=0.8.1",
    "pandas-stubs>=2.2.3.250527",
    "papermill>=2.6.0",
    "plotnine>=0.14.6",
    "pytest>=8.4.1",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.1",
    "scipy-stubs>=1.15.3.0",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-rtd-theme>=3.0.2",
    "types-openpyxl>=3.1.5.20250602",
    "types-python-dateutil>=2.9.0.20250516",
    "types-tqdm>=4.67.0.20250516",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E203", # whitespace before ':'
    "E501", # line too long (handled by ruff formatter)
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
strict_optional = false

# Handle missing imports gracefully
[[tool.mypy.overrides]]
module = [
    "optax.*",
    "sklearn.*",
    "gymnasium.*",
    "tensorflow.*",
    "haiku.*",
    "jax.*",
    "jaxopt.*",
]
ignore_missing_imports = true

# Optional dependencies of the debugging and visualization layers. They ship no type
# information, and they are imported behind availability guards rather than required,
# so a missing stub says nothing about this project's own correctness.
[[tool.mypy.overrides]]
module = [
    "bokeh.*",
    "flask.*",
    "flask_socketio.*",
    "graphviz.*",
    "ipywidgets.*",
    "networkx.*",
    "numba.*",
    "plotly.*",
    "psutil.*",
    "streamlit.*",
]
ignore_missing_imports = true
