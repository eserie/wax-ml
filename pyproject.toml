[project]
name = "wax-ml"
dynamic = ["version"]
description = "A Python library for machine-learning and feedback loops on streaming data"
license = "Apache-2.0"
readme = "README.md"
authors = [
    {name = "WAX-ML Authors", email = "eserie@gmail.com"}
]
keywords = [
    "time series",
    "machine learning", 
    "optimization",
    "optimal control",
    "online learning",
    "reinforcement learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "dm-haiku>=0.0.16",
    "flax>=0.12.4",
    "jax>=0.9.0",
    "jaxlib>=0.9.0",
    "numpy>=2.2.6",
    "optax>=0.2.5",
    # pandas 3 moved the default datetime resolution from nanoseconds to microseconds.
    # wax.stream only whitelists datetime64[ns] (stream.py) and wax.encode casts to it
    # explicitly, so a pandas 3 dataset takes a different synchronization path. Supporting
    # both resolutions is real work in causality-critical code; until it is done, declare
    # the boundary we actually test rather than let a fresh install find it at runtime.
    "pandas>=2.3.0,<3",
    "pooch>=1.8.2",
    "scikit-learn>=1.7.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "xarray>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/eserie/wax-ml"
Repository = "https://github.com/eserie/wax-ml"

[project.optional-dependencies]
# Feature extras. Each one names every *direct* requirement of the shipped
# submodules it covers, so `pip install "wax-ml[<extra>]"` is sufficient to
# import them. Nothing here relies on a dependency arriving transitively.

# wax.numba.ewma_numba
numba = [
    "numba>=0.61.2",
]

# wax.flax.debug -- the profiler and the memory tracker read process and system
# memory through psutil.
debug = [
    "psutil>=5.9.0",
]

# wax.flax.visualization -- every backend the package guards an import for.
visualization = [
    "bokeh>=3.4.0",
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "graphviz>=0.21",
    "ipython>=8.0.0",
    "ipywidgets>=8.1.7",
    "matplotlib>=3.10.3",
    "networkx>=3.2",
    "plotly>=5.20.0",
    "streamlit>=1.30.0",
]

# Kept for backwards compatibility: this is the set of extras 0.6.x shipped, with
# the same contents. Prefer the feature extras above, or `complete`.
optional = [
    "graphviz>=0.21",
    "numba>=0.61.2",
    "optax>=0.2.5",
    "plotnine>=0.14.6",
    "pooch>=1.8.2",
    "pyarrow>=20.0.0",
]

# Everything optional, in one name. This is what the README and the Colab
# notebooks install; it must stay the union of the extras above.
complete = [
    "bokeh>=3.4.0",
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "graphviz>=0.21",
    "ipython>=8.0.0",
    "ipywidgets>=8.1.7",
    "matplotlib>=3.10.3",
    "networkx>=3.2",
    "numba>=0.61.2",
    "optax>=0.2.5",
    "plotly>=5.20.0",
    "plotnine>=0.14.6",
    "pooch>=1.8.2",
    "psutil>=5.9.0",
    "pyarrow>=20.0.0",
    "streamlit>=1.30.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Setuptools sets this to true by default for pyproject-configured projects, which
# sweeps anything MANIFEST.in mentions into the wheel as package data -- including
# src/wax/flax/examples/, a directory with no __init__.py that the `exclude` below
# therefore never sees (find_packages does not discover it, so there is nothing to
# exclude). Turning it off makes package-data explicit, and the two entries under
# [tool.setuptools.package-data] are the complete list of non-code files we ship.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
# Demo material, not API: nothing in the package imports wax.flax.examples, and the
# docs point at it as source to read in the repository, not as an importable module.
exclude = ["wax.flax.examples", "wax.flax.examples.*"]

# PEP 561 marker. Without it the annotations are invisible to type checkers running
# against an installed wax-ml -- including mypy in this project's own CI, which
# resolves the package rather than the source tree.
[tool.setuptools.package-data]
wax = ["py.typed", "VERSION"]

[tool.setuptools.dynamic]
version = {file = "src/wax/VERSION"}

[dependency-groups]
dev = [
    "autoflake>=2.3.1",
    "autopep8>=2.3.2",
    "black>=25.1.0",
    "coverage>=7.9.1",
    "flaky>=3.8.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "isort>=5.3.0",
    "jupyter-cache>=1.0.0",
    "jupytext>=1.17.2",
    "line-profiler>=4.2.0",
    "matplotlib>=3.10.3",
    "mypy>=1.16.1",
    "myst-nb>=1.2.0",
    "nbconvert>=7.16.6",
    "nbstripout>=0.8.1",
    "pandas-stubs>=2.2.3.250527",
    "papermill>=2.6.0",
    "plotnine>=0.14.6",
    "pytest>=8.4.1",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.1",
    "scipy-stubs>=1.15.3.0",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-rtd-theme>=3.0.2",
    "types-openpyxl>=3.1.5.20250602",
    "types-python-dateutil>=2.9.0.20250516",
    "types-tqdm>=4.67.0.20250516",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E203", # whitespace before ':'
    "E501", # line too long (handled by ruff formatter)
    "C901", # too complex
    # `isinstance(x, (A, B))` -> `isinstance(x, A | B)`. Deprecated by ruff itself:
    # the PEP 604 spelling is slower in `isinstance`, and it wrongly suggests that
    # the rest of the typing syntax works there too. The tuple form stays.
    "UP038", # non-pep604-isinstance
]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
strict_optional = false

# Handle missing imports gracefully
[[tool.mypy.overrides]]
module = [
    "optax.*",
    "sklearn.*",
    "gymnasium.*",
    "tensorflow.*",
    "haiku.*",
    "jax.*",
    "jaxopt.*",
]
ignore_missing_imports = true

# Optional dependencies of the debugging and visualization layers. They ship no type
# information, and they are imported behind availability guards rather than required,
# so a missing stub says nothing about this project's own correctness.
[[tool.mypy.overrides]]
module = [
    "bokeh.*",
    "flask.*",
    "flask_socketio.*",
    "graphviz.*",
    "ipywidgets.*",
    "networkx.*",
    "numba.*",
    "plotly.*",
    "psutil.*",
    "streamlit.*",
]
ignore_missing_imports = true
